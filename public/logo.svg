<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 240" role="img" aria-label="Ward">
  <defs>
    <radialGradient id="halo" cx="50%" cy="42%" r="55%">
      <stop offset="0%" stop-color="#c44848" stop-opacity="0.35"/>
      <stop offset="55%" stop-color="#3a1a22" stop-opacity="0.2"/>
      <stop offset="100%" stop-color="#07060a" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="metal" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#f0d090"/>
      <stop offset="45%" stop-color="#c9a56a"/>
      <stop offset="100%" stop-color="#6e5a3e"/>
    </linearGradient>
    <linearGradient id="stone" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#1c1622"/>
      <stop offset="100%" stop-color="#0a0810"/>
    </linearGradient>
  </defs>
  <circle cx="120" cy="120" r="110" fill="url(#halo)"/>
  <circle cx="120" cy="120" r="92" fill="url(#stone)" stroke="url(#metal)" stroke-width="3"/>
  <circle cx="120" cy="120" r="78" fill="none" stroke="#7a1c24" stroke-width="1.5" opacity="0.85"/>
  <circle cx="120" cy="120" r="68" fill="none" stroke="url(#metal)" stroke-width="1.2" stroke-dasharray="4 7" opacity="0.7"/>
  <!-- Gate arch -->
  <path d="M78 158 V108 A42 42 0 0 1 162 108 V158" fill="none" stroke="url(#metal)" stroke-width="6" stroke-linecap="round"/>
  <path d="M88 158 V112 A32 32 0 0 1 152 112 V158" fill="#120a10" stroke="#3a2a18" stroke-width="2"/>
  <!-- Keystone / ward sigil -->
  <path d="M120 52 L132 96 L120 140 L108 96 Z" fill="url(#metal)"/>
  <circle cx="120" cy="96" r="7" fill="#1a0c10" stroke="#f0d090" stroke-width="1.5"/>
  <circle cx="120" cy="96" r="2.5" fill="#e0c078"/>
  <!-- Side spikes -->
  <path d="M52 120 L72 112 L72 128 Z" fill="url(#metal)"/>
  <path d="M188 120 L168 112 L168 128 Z" fill="url(#metal)"/>
  <!-- Base threshold -->
  <rect x="74" y="156" width="92" height="8" rx="1" fill="url(#metal)"/>
  <rect x="86" y="164" width="68" height="4" rx="1" fill="#7a1c24" opacity="0.8"/>
</svg>
